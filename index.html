<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />
    <meta name="description" content="Raul Miranda Designer. Portfólio, Portal RMS e experiências digitais." />
    <meta name="rms-shopping-version" content="1.6.0" />
    <link rel="icon" type="image/png" href="./assets/rms-mark.png" />
    <link rel="apple-touch-icon" href="./assets/rms-mark.png" />
    <title>Raul Miranda Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./portfolio/supabase-config.js"></script>
    <style>
      /* RMS Shopping, movimento editorial em marfim com azul profundo, teal e laranja. Cada camada responde com leveza ao cursor e ao dispositivo. */
      :root{--ivory:#f7f2e9;--ink:#172c3e;--blue:#1f3950;--teal:#167a83;--orange:#f97316;--glow-x:52%;--glow-y:45%;--shift-x:0px;--shift-y:0px;--strength:1;--ease:cubic-bezier(.23,1,.32,1)}
      *{box-sizing:border-box}html{background:var(--ivory)}body{margin:0;min-width:320px;min-height:100vh;overflow-x:hidden;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--ivory)}button,a{font:inherit}button{cursor:pointer}.scene{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(ellipse 76% 82% at var(--glow-x) var(--glow-y),rgba(249,115,22,.17),transparent 44%),radial-gradient(ellipse 58% 72% at 5% 100%,rgba(22,122,131,.2),transparent 58%),var(--ivory)}.scene:after{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 72% 18%,rgba(255,255,255,.8),transparent 24%),radial-gradient(circle at 88% 78%,rgba(249,115,22,.08),transparent 25%);pointer-events:none}.lava{position:absolute;width:clamp(240px,32vw,560px);aspect-ratio:1;border-radius:46% 54% 61% 39%/48% 35% 65% 52%;filter:blur(4px);opacity:.26;mix-blend-mode:multiply;animation:float 14s var(--ease) infinite alternate}.lava.one{top:-19%;right:-7%;background:radial-gradient(circle at 35% 35%,#ffd3ab,#f97316 48%,transparent 69%)}.lava.two{bottom:-28%;left:-10%;background:radial-gradient(circle at 57% 38%,#a0e0d8,#167a83 50%,transparent 70%);animation-delay:-7s}.lava.three{top:39%;left:44%;width:220px;opacity:.1;background:var(--blue);animation-delay:-4s}.rings{position:absolute;right:-10vw;top:3vh;width:min(45vw,670px);aspect-ratio:1;border:1px solid rgba(31,57,80,.13);border-radius:50%;transform:translate(calc(var(--shift-x)*-.28),calc(var(--shift-y)*-.28));transition:transform .35s var(--ease)}.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(31,57,80,.11)}.rings:before{inset:10%}.rings:after{inset:24%}
      .shell{position:relative;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(330px,.82fr);align-items:center;gap:clamp(34px,7vw,116px);padding:clamp(28px,5.2vw,82px);isolation:isolate}.intro{max-width:800px;transform:translate(calc(var(--shift-x)*-.16),calc(var(--shift-y)*-.16));transition:transform .4s var(--ease)}.brand{display:inline-flex;align-items:center;gap:12px;color:var(--ink);font:800 14px "Inter Tight";letter-spacing:.02em;text-transform:uppercase}.brand img{display:block;width:43px;height:43px;object-fit:contain;border-radius:14px;filter:drop-shadow(0 10px 18px rgba(249,115,22,.22))}.locale{position:absolute;right:clamp(24px,5.2vw,82px);top:clamp(24px,4vw,56px);z-index:4;display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid rgba(23,44,62,.14);border-radius:999px;background:rgba(255,253,249,.64);backdrop-filter:blur(14px);color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:transform .18s var(--ease),background .18s var(--ease)}.locale:hover{transform:translateY(-3px);background:#fff}.locale:active{transform:scale(.96)}.locale b{width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(249,115,22,.14)}.eyebrow{margin:clamp(68px,14vh,165px) 0 17px;color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.intro h1{max-width:730px;margin:0;font:800 clamp(52px,8vw,116px)/.86 "Inter Tight";letter-spacing:-.078em}.intro h1 span{display:block}.intro h1 em{font-style:normal;color:var(--teal)}.intro p{max-width:575px;margin:29px 0 0;color:#536876;font-size:clamp(16px,1.52vw,20px);line-height:1.56}.badge-line{display:flex;align-items:center;gap:9px;margin-top:28px;color:#647782;font-size:12px}.pulse{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(22,122,131,.35);animation:pulse 2.6s infinite}.side{position:relative;transform:translate(calc(var(--shift-x)*.22),calc(var(--shift-y)*.22));transition:transform .4s var(--ease)}.cards{display:grid;gap:14px}.card{position:relative;display:flex;align-items:center;gap:17px;min-height:151px;padding:24px;overflow:hidden;border:1px solid rgba(255,255,255,.85);border-radius:28px;background:rgba(255,253,249,.73);box-shadow:0 26px 70px rgba(23,44,62,.13);backdrop-filter:blur(18px);transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(116deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);transform:translateX(-125%);transition:transform .75s var(--ease)}.card:hover{transform:translateX(-11px) translateY(-2px);border-color:rgba(249,115,22,.4);box-shadow:0 34px 78px rgba(23,44,62,.2)}.card:hover:before{transform:translateX(125%)}.card:active{transform:scale(.978)}.shortcut-icon{position:relative;z-index:1;display:grid;place-items:center;flex:0 0 54px;width:54px;height:54px;overflow:hidden;border-radius:18px;background:var(--shortcut-color,var(--blue));color:#fff;font:800 21px "Inter Tight";box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 22px color-mix(in srgb,var(--shortcut-color,var(--blue)) 30%,transparent)}.shortcut-icon img{display:block;width:100%;height:100%;object-fit:contain;padding:7px}.card-copy{position:relative;z-index:1;min-width:0}.card small{display:block;overflow:hidden;color:#71828d;font-size:11px;font-weight:800;letter-spacing:.1em;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}.card strong{display:block;overflow:hidden;margin-top:5px;font:800 26px/1 "Inter Tight";letter-spacing:-.055em;text-overflow:ellipsis;white-space:nowrap}.arrow{position:relative;z-index:1;margin-left:auto;color:var(--orange);font-size:25px;transition:transform .2s var(--ease)}.card:hover .arrow{transform:translate(3px,-3px)}.foot{position:absolute;bottom:clamp(26px,5.2vw,82px);left:clamp(28px,5.2vw,82px);display:flex;align-items:center;gap:12px;color:#70808a;font-size:12px}.admin-link{display:inline-flex;align-items:center;gap:6px;color:#596f7b;text-decoration:underline;text-decoration-color:rgba(89,111,123,.35);text-underline-offset:4px;transition:color .2s var(--ease)}.admin-link:hover{color:var(--orange)}.entrance [data-enter]{opacity:0;transform:translateY(20px);animation:assemble .8s var(--ease) forwards}.entrance [data-enter="brand"]{animation-delay:.08s}.entrance [data-enter="eyebrow"]{animation-delay:.17s}.entrance [data-enter="headline"]{animation-delay:.25s}.entrance [data-enter="description"]{animation-delay:.34s}.entrance [data-enter="badge"]{animation-delay:.42s}.entrance .card:nth-child(1){animation-delay:.29s}.entrance .card:nth-child(2){animation-delay:.39s}.entrance .card:nth-child(3){animation-delay:.49s}.entrance .foot{animation-delay:.6s}.motion-off .lava{animation:none}.motion-off .intro,.motion-off .side,.motion-off .rings{transform:none!important}.motion-off *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}@keyframes assemble{to{opacity:1;transform:translateY(0)}}@keyframes float{to{transform:translate(9%,13%) rotate(18deg) scale(1.15);border-radius:61% 39% 43% 57%/36% 58% 42% 64%}}@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(22,122,131,0)}100%{box-shadow:0 0 0 0 rgba(22,122,131,0)}}@media(max-width:780px){.shell{display:block;padding:27px 22px 74px}.locale{right:21px;top:25px}.eyebrow{margin-top:72px}.intro h1{font-size:clamp(50px,15vw,82px)}.side{margin-top:50px}.card{min-height:128px;padding:20px}.card strong{font-size:24px}.foot{position:static;margin-top:42px;flex-wrap:wrap}.rings{right:-34vw;top:1vh;width:105vw}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    </style>
  </head>
  <body class="entrance">
    <div class="scene" aria-hidden="true"><span class="lava one"></span><span class="lava two"></span><span class="lava three"></span><span class="rings"></span></div>
    <main class="shell">
      <button class="locale" id="localeToggle" type="button" aria-label="Trocar idioma"><b></b><span>EN</span></button>
      <section class="intro">
        <a class="brand" href="./" data-enter="brand" aria-label="Início Raul Miranda Designer"><img src="./assets/rms-mark.png" alt="Logo RMS" /><span id="brandName">Raul Miranda Designer</span></a>
        <p class="eyebrow" id="eyebrow" data-enter="eyebrow">Um lugar, frentes diferentes</p>
        <h1 data-enter="headline"><span id="titleLine">Design que abre</span><em id="accentLine">caminhos.</em></h1>
        <p id="description" data-enter="description">Escolha a experiência que faz sentido para você. O portfólio mostra o trabalho. O Portal RMS acompanha cada projeto com clareza.</p>
        <div class="badge-line" data-enter="badge"><span class="pulse"></span><span id="topline">RMS Studio</span></div>
      </section>
      <nav class="side cards" id="shortcuts" aria-label="Entradas RMS"></nav>
      <footer class="foot" data-enter="foot"><span id="footerText">Raul Miranda Designer · Catarina, Brasil</span><a class="admin-link" href="./controle-rms/">Painel RMS ↗</a></footer>
    </main>
    <script>
      const DEFAULT_SETTINGS={locale:'pt',brand:{name:'Raul Miranda Designer',topline:'RMS Studio'},copy:{pt:{eyebrow:'Um lugar, frentes diferentes',title:'Design que abre',accent:'caminhos.',description:'Escolha a experiência que faz sentido para você. O portfólio mostra o trabalho. O Portal RMS acompanha cada projeto com clareza.',footer:'Raul Miranda Designer · Catarina, Brasil'},en:{eyebrow:'One place, different fronts',title:'Design that opens',accent:'paths.',description:'Choose the experience that makes sense for you. The portfolio shows the work. RMS Portal follows each project with clarity.',footer:'Raul Miranda Designer · Catarina, Brazil'}},shortcuts:[{id:'portfolio',enabled:true,kicker:{pt:'Vitrine pública',en:'Public portfolio'},label:{pt:'Portfólio',en:'Portfolio'},href:'./portfolio/',icon:'R',color:'#1f3950'},{id:'cliente',enabled:true,kicker:{pt:'Área do cliente',en:'Client area'},label:{pt:'Portal RMS',en:'RMS Portal'},href:'./cliente/',icon:'C',color:'#f97316'},{id:'whatsapp',enabled:true,kicker:{pt:'Vamos conversar',en:'Let’s talk'},label:{pt:'WhatsApp',en:'WhatsApp'},href:'https://wa.me/5548996877913',icon:'+',color:'#167a83',external:true}],visual:{ivory:'#f7f2e9',ink:'#172c3e',blue:'#1f3950',teal:'#167a83',orange:'#f97316',motion:true,motionStrength:1,cursorGlow:true,lava:true,introAnimation:true}};
      const escapeHtml=(value)=>String(value??'').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const safeHref=(value)=>/^https?:\/\//i.test(value)||String(value).startsWith('./')||String(value).startsWith('/')?String(value):'#';
      const safeImageUrl=(value)=>/^https:\/\//i.test(String(value))||String(value).startsWith('./')||String(value).startsWith('/')?String(value):'';
      const merge=(base,extra)=>({ ...base,...extra,brand:{...base.brand,...(extra?.brand||{})},copy:{pt:{...base.copy.pt,...(extra?.copy?.pt||{})},en:{...base.copy.en,...(extra?.copy?.en||{})}},visual:{...base.visual,...(extra?.visual||{})},shortcuts:Array.isArray(extra?.shortcuts)?extra.shortcuts:base.shortcuts });
      const config=window.RAUL_PORTFOLIO_SUPABASE_CONFIG||{};const db=config.url&&config.anonKey?window.supabase.createClient(config.url,config.anonKey):null;let settings=DEFAULT_SETTINGS;let locale=localStorage.getItem('rms-shopping-locale')||DEFAULT_SETTINGS.locale;
      function visitorId(){let id=localStorage.getItem('rms-shopping-visitor');if(!id){id=crypto.randomUUID?crypto.randomUUID():`rms-${Date.now()}-${Math.random().toString(36).slice(2)}`;localStorage.setItem('rms-shopping-visitor',id)}return id}
      function track(event_type,item_key=null){if(!db)return;db.from('rms_shopping_events').insert({event_type,item_key,path:location.pathname,visitor_id:visitorId()}).then(()=>{}).catch(()=>{})}
      function applyVisual(){const v=settings.visual;const root=document.documentElement;[['--ivory',v.ivory],['--ink',v.ink],['--blue',v.blue],['--teal',v.teal],['--orange',v.orange],['--strength',v.motionStrength]].forEach(([k,val])=>root.style.setProperty(k,val));document.body.classList.toggle('motion-off',!v.motion);document.querySelectorAll('.lava').forEach((el)=>el.style.display=v.lava?'block':'none');document.body.classList.toggle('entrance',Boolean(v.introAnimation));}
      function render(){const text=settings.copy[locale]||settings.copy.pt;document.documentElement.lang=locale==='en'?'en':'pt-BR';document.title=settings.brand.name||'Raul Miranda Designer';document.getElementById('brandName').textContent=settings.brand.name;document.getElementById('topline').textContent=settings.brand.topline;document.getElementById('eyebrow').textContent=text.eyebrow;document.getElementById('titleLine').textContent=text.title;document.getElementById('accentLine').textContent=text.accent;document.getElementById('description').textContent=text.description;document.getElementById('footerText').textContent=text.footer;document.querySelector('#localeToggle span').textContent=locale==='pt'?'EN':'PT';const cards=settings.shortcuts.filter((item)=>item.enabled!==false).map((item)=>{const logo=safeImageUrl(item.iconUrl);const icon=logo?`<img src="${escapeHtml(logo)}" alt="" />`:escapeHtml(item.icon||'R');return `<a class="card" data-shortcut="${escapeHtml(item.id)}" href="${escapeHtml(safeHref(item.href))}" ${item.external?'target="_blank" rel="noreferrer"':''} style="--shortcut-color:${escapeHtml(item.color||settings.visual.blue)}"><span class="shortcut-icon">${icon}</span><span class="card-copy"><small>${escapeHtml((item.kicker||{})[locale]||(item.kicker||{}).pt||'RMS')}</small><strong>${escapeHtml((item.label||{})[locale]||(item.label||{}).pt||item.id)}</strong></span><span class="arrow" aria-hidden="true">↗</span></a>`}).join('');document.getElementById('shortcuts').innerHTML=cards||'<p>Nenhum atalho ativo no momento.</p>';document.querySelectorAll('[data-shortcut]').forEach((link)=>link.addEventListener('click',()=>track('shortcut_click',link.dataset.shortcut)));applyVisual()}
      document.getElementById('localeToggle').addEventListener('click',()=>{locale=locale==='pt'?'en':'pt';localStorage.setItem('rms-shopping-locale',locale);track('language_change',locale);render()});
      function reactiveMotion(){if(!settings.visual.motion)return;const power=Number(settings.visual.motionStrength||1);window.addEventListener('pointermove',(event)=>{const x=(event.clientX/innerWidth-.5)*24*power,y=(event.clientY/innerHeight-.5)*24*power;document.documentElement.style.setProperty('--shift-x',`${x}px`);document.documentElement.style.setProperty('--shift-y',`${y}px`);if(settings.visual.cursorGlow){document.documentElement.style.setProperty('--glow-x',`${event.clientX/innerWidth*100}%`);document.documentElement.style.setProperty('--glow-y',`${event.clientY/innerHeight*100}%`)}});window.addEventListener('deviceorientation',(event)=>{if(matchMedia('(pointer:fine)').matches)return;const x=Math.max(-14,Math.min(14,Number(event.gamma||0)))*power;const y=Math.max(-14,Math.min(14,Number(event.beta||0)-45))*power;document.documentElement.style.setProperty('--shift-x',`${x}px`);document.documentElement.style.setProperty('--shift-y',`${y}px`)},{passive:true})}
      async function boot(){if(db){const {data}=await db.from('rms_shopping_settings').select('content').eq('id','main').maybeSingle();settings=merge(DEFAULT_SETTINGS,data?.content||{})}locale=localStorage.getItem('rms-shopping-locale')||settings.locale||'pt';render();reactiveMotion();track('view')}
      boot().catch(()=>{render();reactiveMotion()});
    </script>
  </body>
</html>
