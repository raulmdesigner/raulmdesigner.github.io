      @media(max-width:780px){.shell{display:block;padding:27px 22px 76px}.tools{right:21px;top:25px}.eyebrow{margin-top:78px}.intro h1{font-size:clamp(50px,15vw,80px)}.side{margin-top:50px}.card{min-height:128px;padding:20px}.card:hover{transform:translateY(-3px) scale(1.02)}.cards:has(.card:hover) .card:not(:hover){filter:none;opacity:1;transform:none}.card strong{font-size:24px}.foot{position:static;margin-top:42px}.rings{right:-34vw;top:1vh;width:105vw}.lava{opacity:.58}.badge-line{position:static;margin-top:21px}}@media(max-height:700px) and (min-width:781px){.shell{padding-top:30px 5.2vw 52px}.eyebrow{margin-top:66px}.intro h1{font-size:clamp(52px,6.5vw,88px)}.intro p{margin-top:22px}.foot{bottom:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
      /* Refinamentos v1.6.2: a cena fica acima do fundo, mas abaixo do conteúdo. */

  <body class="entrance">
    <div class="scene" aria-hidden="true"><span class="lava one"></span><span class="lava two"></span><span class="lava three"></span><span class="rings"></span></div>
    <main class="shell">
      <div class="tools"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">☾</button><button class="locale" id="localeToggle" type="button" aria-label="Trocar idioma"><b></b><span>EN</span></button></div>
      <section class="intro"><a class="brand" href="./" data-enter="brand" aria-label="Início Raul Miranda Designer"><img src="./assets/rms-mark.png" alt="Logo RMS" /><span id="brandName">Raul Miranda Designer</span></a><p class="eyebrow" id="eyebrow" data-enter="eyebrow">Um lugar, frentes diferentes</p><h1 data-enter="headline"><span id="titleLine">Design que abre</span><em id="accentLine">caminhos.</em></h1><p id="description" data-enter="description">Escolha a experiência que faz sentido para você. O portfólio mostra o trabalho. O Portal RMS acompanha cada projeto com clareza.</p><div class="badge-line" data-enter="badge"><span class="pulse"></span><span id="topline">RMS Studio</span></div></section>
      <nav class="side cards" id="shortcuts" aria-label="Entradas RMS"></nav>
      <footer class="foot" data-enter="foot"><span id="footerText">Raul Miranda Designer · Catarina, Brasil</span></footer>
    </main>
    <script>
      const DEFAULT_SETTINGS={locale:'pt',brand:{name:'Raul Miranda Designer',topline:'RMS Studio'},copy:{pt:{eyebrow:'Um lugar, frentes diferentes',title:'Design que abre',accent:'caminhos.',description:'Escolha a experiência que faz sentido para você. O portfólio mostra o trabalho. O Portal RMS acompanha cada projeto com clareza.',footer:'Raul Miranda Designer · Catarina, Brasil'},en:{eyebrow:'One place, different fronts',title:'Design that opens',accent:'paths.',description:'Choose the experience that makes sense for you. The portfolio shows the work. RMS Portal follows each project with clarity.',footer:'Raul Miranda Designer · Catarina, Brazil'}},shortcuts:[{id:'portfolio',enabled:true,showKicker:true,showLabel:true,kicker:{pt:'Vitrine pública',en:'Public portfolio'},label:{pt:'Portfólio',en:'Portfolio'},href:'./portfolio/',icon:'R',color:'#1f3950'},{id:'cliente',enabled:true,showKicker:true,showLabel:true,kicker:{pt:'Área do cliente',en:'Client area'},label:{pt:'Portal RMS',en:'RMS Portal'},href:'./cliente/',icon:'C',color:'#f97316'},{id:'whatsapp',enabled:true,showKicker:true,showLabel:true,kicker:{pt:'Vamos conversar',en:'Let’s talk'},label:{pt:'WhatsApp',en:'WhatsApp'},href:'https://wa.me/5548996877913',icon:'+',color:'#167a83',external:true}],visual:{ivory:'#f7f2e9',ink:'#172c3e',titleText:'#172c3e',bodyText:'#536876',kickerText:'#647782',footerText:'#70808a',cardText:'#172c3e',blue:'#1f3950',teal:'#167a83',orange:'#f97316',theme:'auto',motion:true,motionStrength:1,cursorGlow:true,lava:true,introAnimation:true,textLines:false}};
      const escapeHtml=(value)=>String(value??'').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const safeHref=(value)=>/^https?:\/\//i.test(value)||String(value).startsWith('./')||String(value).startsWith('/')?String(value):'#';const safeImageUrl=(value)=>/^https:\/\//i.test(String(value))||String(value).startsWith('./')||String(value).startsWith('/')?String(value):'';const merge=(base,extra)=>({...base,...extra,brand:{...base.brand,...(extra?.brand||{})},copy:{pt:{...base.copy.pt,...(extra?.copy?.pt||{})},en:{...base.copy.en,...(extra?.copy?.en||{})}},visual:{...base.visual,...(extra?.visual||{})},shortcuts:Array.isArray(extra?.shortcuts)?extra.shortcuts:base.shortcuts});const normalizeSettings=(source)=>{const v=source.visual||{};if(v.titleText===undefined&&v.heading!==undefined)v.titleText=v.heading;if(v.kickerText===undefined&&v.eyebrowText!==undefined)v.kickerText=v.eyebrowText;if(v.cardText===undefined&&v.shortcutText!==undefined)v.cardText=v.shortcutText;if(v.footerText===undefined)v.footerText=v.bodyText||DEFAULT_SETTINGS.visual.footerText;if(v.theme==='system')v.theme='auto';v.textLines=v.textLines===true||v.textLines==='true';source.visual=v;source.shortcuts=(source.shortcuts||[]).map((item)=>{if(item.showKicker===undefined)item.showKicker=item.kickerEnabled!==false;if(item.showLabel===undefined)item.showLabel=true;return item});return source};const config=window.RAUL_PORTFOLIO_SUPABASE_CONFIG||{};const db=config.url&&config.anonKey?window.supabase.createClient(config.url,config.anonKey):null;let settings=DEFAULT_SETTINGS;let locale=localStorage.getItem('rms-shopping-locale')||DEFAULT_SETTINGS.locale;let themeChoice=localStorage.getItem('rms-shopping-theme')||'auto';
      function visitorId(){let id=localStorage.getItem('rms-shopping-visitor');if(!id){id=crypto.randomUUID?crypto.randomUUID():`rms-${Date.now()}-${Math.random().toString(36).slice(2)}`;localStorage.setItem('rms-shopping-visitor',id)}return id}function track(event_type,item_key=null){if(!db)return;db.from('rms_shopping_events').insert({event_type,item_key,path:location.pathname,visitor_id:visitorId()}).then(()=>{}).catch(()=>{})}function effectiveTheme(){const requested=themeChoice==='auto'?(settings.visual.theme||'auto'):themeChoice;return requested==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):requested}function applyTheme(){const active=effectiveTheme();document.body.dataset.theme=active;document.body.classList.toggle('dark',active==='dark');document.querySelector('meta[name="theme-color"]').content=active==='dark'?'#0d1d2a':settings.visual.ivory;const button=document.getElementById('themeToggle');button.textContent=active==='dark'?'☀':'☾';button.title=active==='dark'?'Usar tema claro':'Usar tema escuro';button.setAttribute('aria-label',button.title)}function applyVisual(){const v=settings.visual;const root=document.documentElement;[['--ivory',v.ivory],['--ink',v.ink],['--title-text',v.titleText],['--body-text',v.bodyText],['--kicker-text',v.kickerText],['--footer-text',v.footerText],['--card-text',v.cardText],['--blue',v.blue],['--teal',v.teal],['--orange',v.orange]].forEach(([k,val])=>root.style.setProperty(k,val));document.body.classList.toggle('motion-off',!v.motion);document.body.classList.toggle('text-lines',v.textLines===true);document.querySelectorAll('.lava').forEach(el=>el.style.display=v.lava?'block':'none');document.body.classList.toggle('entrance',Boolean(v.introAnimation));applyTheme()}
      function render(){const text=settings.copy[locale]||settings.copy.pt;document.documentElement.lang=locale==='en'?'en':'pt-BR';document.title=settings.brand.name||'Raul Miranda Designer';document.getElementById('brandName').textContent=settings.brand.name;document.getElementById('topline').textContent=settings.brand.topline;document.getElementById('eyebrow').textContent=text.eyebrow;document.getElementById('titleLine').textContent=text.title;document.getElementById('accentLine').textContent=text.accent;document.getElementById('description').textContent=text.description;document.getElementById('footerText').textContent=text.footer;document.querySelector('#localeToggle span').textContent=locale==='pt'?'EN':'PT';const cards=settings.shortcuts.filter((item)=>item.enabled!==false).map(item=>{const logo=safeImageUrl(item.iconUrl);const icon=logo?`<img src="${escapeHtml(logo)}" alt="" />`:escapeHtml(item.icon||'R');const kicker=item.showKicker===false?'':`<small>${escapeHtml((item.kicker||{})[locale]||(item.kicker||{}).pt||'RMS')}</small>`;const label=item.showLabel===false?'':`<strong>${escapeHtml((item.label||{})[locale]||(item.label||{}).pt||item.id)}</strong>`;return `<a class="card" data-shortcut="${escapeHtml(item.id)}" href="${escapeHtml(safeHref(item.href))}" ${item.external?'target="_blank" rel="noreferrer"':''} style="--shortcut-color:${escapeHtml(item.color||settings.visual.blue)}"><span class="shortcut-icon">${icon}</span><span class="card-copy">${kicker}${label}</span><span class="arrow" aria-hidden="true">↗</span></a>`}).join('');document.getElementById('shortcuts').innerHTML=cards||'<p>Nenhum atalho ativo no momento.</p>';document.querySelectorAll('[data-shortcut]').forEach(link=>link.addEventListener('click',()=>track('shortcut_click',link.dataset.shortcut)));applyVisual()}
      document.getElementById('localeToggle').addEventListener('click',()=>{locale=locale==='pt'?'en':'pt';localStorage.setItem('rms-shopping-locale',locale);track('language_change',locale);render()});document.getElementById('themeToggle').addEventListener('click',()=>{const next=effectiveTheme()==='dark'?'light':'dark';themeChoice=next;localStorage.setItem('rms-shopping-theme',next);track('theme_change',next);applyTheme()});matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(themeChoice==='auto')applyTheme()});function reactiveMotion(){if(!settings.visual.motion)return;const power=Number(settings.visual.motionStrength||1);window.addEventListener('pointermove',event=>{const x=(event.clientX/innerWidth-.5)*24*power,y=(event.clientY/innerHeight-.5)*24*power;document.documentElement.style.setProperty('--shift-x',`${x}px`);document.documentElement.style.setProperty('--shift-y',`${y}px`);if(settings.visual.cursorGlow){document.documentElement.style.setProperty('--glow-x',`${event.clientX/innerWidth*100}%`);document.documentElement.style.setProperty('--glow-y',`${event.clientY/innerHeight*100}%`)}});window.addEventListener('deviceorientation',event=>{if(matchMedia('(pointer:fine)').matches)return;const x=Math.max(-14,Math.min(14,Number(event.gamma||0)))*power,y=Math.max(-14,Math.min(14,Number(event.beta||0)-45))*power;document.documentElement.style.setProperty('--shift-x',`${x}px`);document.documentElement.style.setProperty('--shift-y',`${y}px`)},{passive:true})}async function boot(){if(db){const {data}=await db.from('rms_shopping_settings').select('content').eq('id','main').maybeSingle();settings=normalizeSettings(merge(DEFAULT_SETTINGS,data?.content||{}))}else settings=normalizeSettings(structuredClone(DEFAULT_SETTINGS));locale=localStorage.getItem('rms-shopping-locale')||settings.locale||'pt';render();reactiveMotion();track('view')}boot().catch(()=>{settings=normalizeSettings(structuredClone(DEFAULT_SETTINGS));render();reactiveMotion()});
    </script>
