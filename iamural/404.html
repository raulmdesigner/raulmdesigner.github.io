<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>IAMUREL Redirect</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Mitigates 404s when accessing a direct URL.
      // Redirects to the index.html which handles routing.
      var pathSegmentsToKeep = 1; // 1 because the base is /iamurel/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1 + pathSegmentsToKeep).split('/').slice(1).join('/') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
